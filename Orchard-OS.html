<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchard OS · 贝贝农场</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#F4F7F1;
  --surface:#FFFFFF;
  --surface-2:#EAF0E4;
  --surface-3:#DEE8D6;
  --border:#D3DECB;
  --text:#15231B;
  --text-muted:#4C5D50;
  --text-faint:#7C8B7E;
  --primary:#1F4B3D;
  --primary-strong:#0F2E23;
  --primary-soft:#DCEAE1;
  --secondary:#8A5A2E;
  --secondary-soft:#F1E1CC;
  --accent:#C98A22;
  --accent-strong:#A86E15;
  --accent-soft:#F6E3BB;
  --good:#2E7D4F;
  --good-soft:#DCEFE0;
  --warn:#B4791A;
  --warn-soft:#F7E7CB;
  --critical:#B4402A;
  --critical-soft:#F6DBD2;
  --info:#2C6E8E;
  --info-soft:#DCEBF1;
  --shadow-color:220 20% 20%;
  --facet:10px;
  --facet-sm:6px;
  --font-display:'Fraunces',ui-serif,Georgia,serif;
  --font-body:'Manrope','Noto Sans SC',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1712;
    --surface:#15211A;
    --surface-2:#1B2A21;
    --surface-3:#233428;
    --border:#2B3D30;
    --text:#E9F1E9;
    --text-muted:#A6B8AA;
    --text-faint:#7A8C7E;
    --primary:#7FCBA0;
    --primary-strong:#A6DDBC;
    --primary-soft:#1E3A2C;
    --secondary:#D7A768;
    --secondary-soft:#33291B;
    --accent:#EFBB4F;
    --accent-strong:#F5CE79;
    --accent-soft:#3A2E15;
    --good:#5CBE85;
    --good-soft:#1C3524;
    --warn:#E0A23D;
    --warn-soft:#3A2C12;
    --critical:#E38267;
    --critical-soft:#3B2019;
    --info:#6BB6D6;
    --info-soft:#183038;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1712;
  --surface:#15211A;
  --surface-2:#1B2A21;
  --surface-3:#233428;
  --border:#2B3D30;
  --text:#E9F1E9;
  --text-muted:#A6B8AA;
  --text-faint:#7A8C7E;
  --primary:#7FCBA0;
  --primary-strong:#A6DDBC;
  --primary-soft:#1E3A2C;
  --secondary:#D7A768;
  --secondary-soft:#33291B;
  --accent:#EFBB4F;
  --accent-strong:#F5CE79;
  --accent-soft:#3A2E15;
  --good:#5CBE85;
  --good-soft:#1C3524;
  --warn:#E0A23D;
  --warn-soft:#3A2C12;
  --critical:#E38267;
  --critical-soft:#3B2019;
  --info:#6BB6D6;
  --info-soft:#183038;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;color:var(--text)}
[data-lang="zh"] h1,[data-lang="zh"] h2,[data-lang="zh"] h3,[data-lang="zh"] h4{font-family:'Noto Sans SC',var(--font-body);font-weight:700}
p{margin:0}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent-soft);color:var(--primary-strong)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.tabnum{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

.facet-lg{clip-path:polygon(var(--facet) 0,100% 0,100% calc(100% - var(--facet)),calc(100% - var(--facet)) 100%,0 100%,0 var(--facet));}
.facet-sm{clip-path:polygon(var(--facet-sm) 0,100% 0,100% calc(100% - var(--facet-sm)),calc(100% - var(--facet-sm)) 100%,0 100%,0 var(--facet-sm));}
.facet-tl{clip-path:polygon(var(--facet-sm) 0,100% 0,100% 100%,0 100%,0 var(--facet-sm));}

#app{min-height:100vh;background:var(--bg)}
.container{max-width:1180px;margin:0 auto;padding:0 28px}
@media (max-width:640px){.container{padding:0 16px}}

/* ============================= TOP NAV ============================= */
.topnav{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.topnav-inner{max-width:1180px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:16px}
@media (max-width:640px){.topnav-inner{padding:12px 16px;gap:10px}}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.brand-mark{width:32px;height:32px;flex-shrink:0}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--text)}
.brand-text span{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint)}
.navtabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;margin-left:auto}
.navtabs button{
  border:none;background:transparent;padding:8px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;color:var(--text-muted);transition:background .15s,color .15s;
  white-space:nowrap;
}
.navtabs button.active{background:var(--primary);color:#fff}
.navtabs button:hover:not(.active){color:var(--text)}
.langtoggle{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:999px;flex-shrink:0}
.langtoggle button{border:none;background:transparent;padding:7px 12px;font-size:11.5px;font-weight:700;color:var(--text-muted);border-radius:999px;white-space:nowrap}
.langtoggle button.active{background:var(--primary);color:#fff}
@media (max-width:760px){
  .topnav-inner{flex-wrap:wrap;row-gap:10px}
  .navtabs{margin-left:0;overflow-x:auto;width:100%;order:3;flex-basis:100%}
  .navtabs button{padding:7px 12px;font-size:12.5px}
  .langtoggle{margin-left:auto}
}

/* ============================= BUTTONS / TAGS ============================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;font-size:13.5px;font-weight:700;border:none;
  background:var(--primary);color:#fff;transition:transform .12s,background .15s;
}
.btn.facet-sm:active{transform:translateY(1px)}
.btn:hover{background:var(--primary-strong)}
.btn-accent{background:var(--accent);color:#2A1C02}
.btn-accent:hover{background:var(--accent-strong)}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-outline{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.4px var(--border)}
.btn-outline:hover{box-shadow:inset 0 0 0 1.4px var(--primary)}
.btn-sm{padding:7px 13px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.pill-good{background:var(--good-soft);color:var(--good)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-critical{background:var(--critical-soft);color:var(--critical)}
.pill-info{background:var(--info-soft);color:var(--info)}
.pill-neutral{background:var(--surface-3);color:var(--text-muted)}
.pill-accent{background:var(--accent-soft);color:var(--accent-strong)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-good{background:var(--good)}.dot-warn{background:var(--warn)}.dot-critical{background:var(--critical)}.dot-info{background:var(--info)}

/* ============================= CARD ============================= */
.card{background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);filter:drop-shadow(0 1px 2px hsl(var(--shadow-color)/.06));padding:20px}
.card-pad-lg{padding:26px}

/* ============================= LANDING ============================= */
.hero{
  background:linear-gradient(155deg,#0F2E23 0%,#1F4B3D 62%,#2E6650 100%);
  color:#fff;position:relative;overflow:hidden;
}
.hero-inner{max-width:1180px;margin:0 auto;padding:76px 28px 64px;position:relative;z-index:2}
@media (max-width:640px){.hero-inner{padding:52px 16px 44px}}
.hero-eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#C9E6D4;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.hero-eyebrow::before{content:"";width:22px;height:1px;background:#C9E6D4;opacity:.6}
.hero h1{font-size:clamp(34px,5.4vw,58px);line-height:1.1;color:#fff;font-weight:600;max-width:16ch}
.hero-sub{margin-top:20px;font-size:17px;line-height:1.55;color:#DCEDE2;max-width:52ch}
.hero-cn{font-family:var(--font-display);font-size:15px;color:#B9DBC4;margin-top:8px;font-style:italic}
.hero-ctas{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.16);margin-top:56px;max-width:640px}
.hero-stat{background:#0F2E23;padding:18px 20px}
.hero-stat b{display:block;font-family:var(--font-mono);font-size:26px;font-weight:600;color:#fff}
.hero-stat span{font-size:11.5px;color:#BFDECB;text-transform:uppercase;letter-spacing:.05em}
.hero-durian{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:420px;height:420px;opacity:.16;z-index:1}
@media (max-width:900px){.hero-durian{display:none}}

.section{padding:64px 0}
.section-head{max-width:640px;margin-bottom:36px}
.section-eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-strong);font-weight:800;margin-bottom:10px}
.section-head h2{font-size:clamp(24px,3vw,32px)}
.section-head p{color:var(--text-muted);margin-top:12px;font-size:15px;line-height:1.6}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
@media (max-width:760px){.compare{grid-template-columns:1fr}}
.compare-col{background:var(--surface);padding:26px}
.compare-col h3{font-size:15px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.compare-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.compare-col li{font-size:14px;color:var(--text-muted);line-height:1.5;padding-left:18px;position:relative}
.compare-col.old li::before{content:"–";position:absolute;left:0;color:var(--critical);font-weight:700}
.compare-col.new li::before{content:"+";position:absolute;left:0;color:var(--good);font-weight:700}

.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media (max-width:900px){.steps5{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.steps5{grid-template-columns:1fr}}
.step-card{background:var(--surface);padding:20px 18px;position:relative}
.step-num{font-family:var(--font-mono);font-size:11px;color:var(--accent-strong);font-weight:700;margin-bottom:10px;letter-spacing:.05em}
.step-card h4{font-size:14.5px;margin-bottom:6px}
.step-card p{font-size:12.5px;color:var(--text-muted);line-height:1.5}

.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:820px){.roadmap{grid-template-columns:repeat(2,1fr)}}
.road-card{background:var(--surface);padding:20px}
.road-year{font-family:var(--font-mono);font-size:13px;color:var(--primary);font-weight:700;margin-bottom:6px}
.road-card h4{font-size:15px;margin-bottom:8px}
.road-card p{font-size:12.5px;color:var(--text-muted);line-height:1.5}

.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.entry-grid{grid-template-columns:1fr}}
.entry-card{
  background:var(--surface);padding:30px;cursor:pointer;transition:filter .15s,transform .15s;
  display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px var(--border);
}
.entry-card:hover{transform:translateY(-2px)}
.entry-icon{width:44px;height:44px}
.entry-card h3{font-size:20px}
.entry-card p{color:var(--text-muted);font-size:13.5px;line-height:1.55}
.entry-card .btn{align-self:flex-start;margin-top:6px}

.pilot-metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--border)}
@media (max-width:900px){.pilot-metrics{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.pilot-metrics{grid-template-columns:repeat(2,1fr)}}
.pilot-metric{background:var(--surface);padding:16px 14px}
.pilot-metric span{display:block;font-size:11px;color:var(--text-faint);line-height:1.4;margin-top:4px}
.pilot-metric b{font-family:var(--font-mono);font-size:12.5px;color:var(--primary)}
[data-lang="zh"] .pilot-metric b{font-family:var(--font-body);font-size:13.5px}

.landing-footer{padding:30px 0 50px;text-align:center;color:var(--text-faint);font-size:12px}

/* ============================= APP SHELLS ============================= */
.appshell{display:flex;min-height:calc(100vh - 66px)}
.appsidebar{
  width:216px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  padding:22px 12px;position:sticky;top:66px;align-self:flex-start;height:calc(100vh - 66px);overflow-y:auto;
}
.side-persona{padding:10px 12px 18px;margin-bottom:10px;border-bottom:1px solid var(--border)}
.side-persona label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);font-weight:700}
.side-persona select{
  width:100%;margin-top:8px;padding:9px 10px;background:var(--surface-2);border:none;
  color:var(--text);font-size:13px;font-weight:600;
}
.sidebtn{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:none;background:transparent;
  padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--text-muted);margin-bottom:2px;
}
.sidebtn svg{width:17px;height:17px;flex-shrink:0;opacity:.8}
.sidebtn.active{background:var(--primary-soft);color:var(--primary-strong)}
.sidebtn.active svg{opacity:1}
.sidebtn:hover:not(.active){background:var(--surface-2);color:var(--text)}
.sidefoot{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

.appmain{flex:1;min-width:0;padding:28px 32px 70px}
@media (max-width:900px){
  .appshell{flex-direction:column}
  .appsidebar{width:100%;position:static;height:auto;display:flex;overflow-x:auto;padding:12px;gap:4px;align-items:center}
  .side-persona{border-bottom:none;padding:0 8px 0 0;margin-bottom:0;flex-shrink:0;min-width:150px}
  .sidebtn{white-space:nowrap;width:auto;margin-bottom:0}
  .sidefoot{display:none}
  .appmain{padding:20px 16px 60px}
}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.view-head h2{font-size:23px}
.view-head p{color:var(--text-muted);font-size:13.5px;margin-top:4px}

/* ============================= GRIDS / STATS ============================= */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:24px}
.stat-tile{background:var(--surface);padding:16px 18px;box-shadow:inset 0 0 0 1px var(--border)}
.stat-tile .lbl{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
[data-lang="zh"] .stat-tile .lbl{text-transform:none;letter-spacing:0}
.stat-tile .val{font-family:var(--font-mono);font-size:25px;font-weight:600;margin-top:8px;color:var(--text)}
.stat-tile .delta{font-size:11.5px;margin-top:6px;font-weight:600}
.delta-up{color:var(--good)}.delta-down{color:var(--critical)}

.twocol{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:980px){.twocol{grid-template-columns:1fr}}

.barrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.barrow .barlbl{width:78px;flex-shrink:0;font-size:12px;color:var(--text-muted);font-family:var(--font-mono)}
[data-lang="zh"] .barrow .barlbl{font-family:var(--font-body);width:88px}
.bartrack{flex:1;height:9px;background:var(--surface-2);position:relative;overflow:hidden}
.barfill{height:100%;background:var(--primary)}
.barval{width:44px;text-align:right;font-family:var(--font-mono);font-size:12px;font-weight:600;flex-shrink:0}
.stackbar{display:flex;height:26px;width:100%;overflow:hidden;background:var(--surface-2)}
.stackseg{height:100%}
.stacklegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.stacklegend .li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
.stacklegend .sw{width:10px;height:10px}

/* ============================= TREE CARDS ============================= */
.treegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.treecard{background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);overflow:hidden;cursor:pointer;transition:filter .15s}
.treecard:hover{box-shadow:inset 0 0 0 1.4px var(--primary)}
.treecard-art{height:118px;display:flex;align-items:center;justify-content:center;position:relative}
.treecard-art svg{width:74px;height:74px}
.treecard-body{padding:13px 14px 15px}
.treecard-id{font-family:var(--font-mono);font-size:12px;color:var(--text-faint);display:flex;justify-content:space-between;align-items:center}
.treecard-body h4{font-size:14.5px;margin-top:5px}
.treecard-meta{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}

.tier-A{background:var(--accent-soft)}
.tier-B{background:var(--primary-soft)}
.tier-C{background:var(--secondary-soft)}

/* ============================= TABLE ============================= */
.tablewrap{overflow-x:auto;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
thead th{
  text-align:left;padding:11px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-faint);border-bottom:1px solid var(--border);background:var(--surface-2);font-weight:700;white-space:nowrap;
}
[data-lang="zh"] thead th{text-transform:none;letter-spacing:0}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.wrap{white-space:normal}
.rowbtn{border:none;background:var(--surface-2);padding:5px 11px;font-size:11.5px;font-weight:700;color:var(--text)}
.rowbtn:hover{background:var(--surface-3)}

/* ============================= STEPPER ============================= */
.stepper{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
.stepnode{display:flex;flex-direction:column;align-items:center;min-width:96px;position:relative;flex-shrink:0}
.stepnode:not(:last-child)::after{content:"";position:absolute;top:15px;left:56%;width:100%;height:2px;background:var(--border);z-index:0}
.stepnode.done:not(:last-child)::after{background:var(--primary)}
.stepcircle{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-faint);position:relative;z-index:1;box-shadow:0 0 0 4px var(--surface)}
.stepnode.done .stepcircle{background:var(--primary);color:#fff}
.stepnode.current .stepcircle{background:var(--accent);color:#2A1C02}
.stepnode span{font-size:11px;margin-top:8px;color:var(--text-muted);text-align:center;font-weight:600}
.stepnode.current span{color:var(--text);font-weight:700}

/* ============================= BLINDBOX ============================= */
.boxgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
@media (max-width:700px){.boxgrid{grid-template-columns:repeat(2,1fr)}}
.boxcard{
  aspect-ratio:3/4;background:linear-gradient(150deg,var(--primary),var(--primary-strong));
  display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2);perspective:800px;
}
.boxcard svg{width:38px;height:38px;opacity:.85}
.boxcard.revealed{cursor:default;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)}
.boxcard .front,.boxcard .back{transition:opacity .3s}
.boxcard.revealed .front{display:none}
.boxcard .back{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%;padding:10px;text-align:center}
.boxcard.revealed .back{display:flex}
.boxcard .back b{font-family:var(--font-mono);font-size:12px;margin-top:8px}
[data-lang="zh"] .boxcard .back b{font-family:var(--font-body)}
.boxcard .back span{font-size:10.5px;color:var(--text-muted);margin-top:3px}

/* ============================= DIAGNOSIS ============================= */
.diag-tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--surface-2);padding:4px;width:fit-content;flex-wrap:wrap}
.diag-tabs button{border:none;background:transparent;padding:8px 15px;font-size:12.5px;font-weight:700;color:var(--text-muted)}
.diag-tabs button.active{background:var(--surface);color:var(--primary)}
.upload-zone{
  background:var(--surface);box-shadow:inset 0 0 0 1.6px dashed var(--border);padding:34px 20px;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;
}
.upload-zone svg{width:40px;height:40px;color:var(--text-faint)}
.upload-zone p{color:var(--text-muted);font-size:13px}
.preview-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.preview-thumb{width:150px;height:150px;object-fit:cover;box-shadow:inset 0 0 0 1px var(--border);flex-shrink:0}
.result-card{flex:1;min-width:260px;background:var(--surface-2);padding:18px}
.confidence-bar{height:7px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.confidence-fill{height:100%;background:var(--accent)}
.symptom-chip{
  border:none;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border);padding:9px 13px;
  font-size:12.5px;font-weight:600;color:var(--text-muted);text-align:left;
}
.symptom-chip.selected{background:var(--primary-soft);box-shadow:inset 0 0 0 1.5px var(--primary);color:var(--primary-strong)}
.symptom-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:9px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lib-card{background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:17px}
.lib-card h4{font-size:14.5px;margin-bottom:2px}
.lib-card .sci{font-size:11.5px;font-style:italic;color:var(--text-faint);margin-bottom:10px}
.lib-card ul{margin:8px 0 0;padding-left:16px;font-size:12px;color:var(--text-muted);line-height:1.6}

/* ============================= KANBAN ============================= */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:820px){.kanban{grid-template-columns:1fr}}
.kancol{background:var(--surface-2);padding:14px}
.kancol h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-bottom:12px;display:flex;justify-content:space-between}
[data-lang="zh"] .kancol h4{text-transform:none;letter-spacing:0}
.kancard{background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);padding:12px 13px;margin-bottom:9px}
.kancard b{font-size:13px;display:block}
.kancard span{font-size:11.5px;color:var(--text-muted)}

/* ============================= MODAL ============================= */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,18,14,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);max-width:560px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:inset 0 0 0 1px var(--border)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 24px 0}
.modal-close{border:none;background:var(--surface-2);width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-muted)}
.modal-body{padding:16px 24px 26px}

/* ============================= ALLOCATOR ============================= */
.alloc-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.alloc-row label{width:96px;flex-shrink:0;font-size:13px;font-weight:700}
.alloc-row input[type=range]{flex:1;accent-color:var(--primary)}
.alloc-row .kgval{width:56px;text-align:right;font-family:var(--font-mono);font-weight:600;font-size:13px}

/* misc */
.flex{display:flex}.items-center{align-items:center}.gap8{gap:8px}.gap12{gap:12px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb16{margin-bottom:16px}
.muted{color:var(--text-muted)}

.empty{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13px}

.badge-severity-low{background:var(--good-soft);color:var(--good)}

function buildOrchard(){
  const groups=[]; const trees=[]; const members=[];
  const issuePlan = [
    {g:1,t:1,d:'algal-leaf-spot',sev:'low'},
    {g:3,t:3,d:'pink-disease',sev:'moderate'},
    {g:6,t:0,d:'patch-canker',sev:'critical'},
    {g:8,t:2,d:'mealybug',sev:'low'},
  ];
  for(let g=1; g<=10; g++){
    const gid = 'G'+String(g).padStart(2,'0');
    const tiers = ['A','B','B','B','C'];
    const groupTrees=[];
    tiers.forEach((tier,idx)=>{
      const n = groupTrees.filter(t=>t.tier===tier).length+1;
      const treeId = `BB-${gid}-${tier}${n}`;
      let stage;
      const r = rng();
      if(g<=1) stage = r<.5?'Harvest-Ready':'Fruiting';
      else if(g<=3) stage = r<.6?'Fruiting':'Flowering';
      else if(g<=6) stage = r<.55?'Flowering':'Growing';
      else stage = r<.75?'Growing':'Flowering';
      if(g===9 && idx===4) stage='Harvested';
      if(g===10 && idx===0) stage='Dormant';
      const issue = issuePlan.find(p=>p.g===g && p.t===idx);
      trees.push({
        id:treeId, group:gid, tier, idx, variety:pick(VARIETIES),
        age: randInt(4,7), stage,
        health: issue?'Issue':(rng()<0.14?'Watch':'Healthy'),
        issueId: issue?issue.d:null, severity: issue?issue.sev:null,
        lastUpdateEn: `${randInt(1,27)} Aug 2026`, lastUpdateZh: `2026年8月${randInt(1,27)}日`,
        bloomRate: stage==='Flowering'?randInt(55,92):null,
        expectedFruit: (stage==='Fruiting'||stage==='Harvest-Ready')?randInt(8,22):null,
        weightKg: stage==='Harvested'?randInt(28,46):null,
        grade: stage==='Harvested'?pick(['exportA','exportA','premiumB']):null,
      });
      groupTrees.push(trees[trees.length-1]);
    });
    groups.push({id:gid,idx:g,trees:groupTrees});
    const hh = HOUSEHOLDS[g-1];
    members.push({
      id:'M'+String(g).padStart(2,'0'), household:hh, group:gid,
      joinMonth: randInt(3,11), planMonths:24, referralCode:`BEIBEI${hh.surname.toUpperCase()}`,
      credits: randInt(0,180), referrals: randInt(0,4),
      boxOpened: g!==5 && g!==9,
    });
  }
  return {groups,trees,members};
}

/* ---------- image analysis heuristic (real pixel data, not fabricated) ---------- */
function rgbToHsl(r,g,b){
  r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;
  if(max===min){h=0;s=0} else {
    const d=max-min; s=l>.5?d/(2-max-min):d/(max+min);
    switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4}
    h*=60;
  }
  return [h,s,l];
}
function analyzeImageFile(file){
  return new Promise((resolve)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e=>{ img.onload=()=>{
      const size=48;
      const canvas=document.createElement('canvas'); canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,size,size);
      const data=ctx.getImageData(0,0,size,size).data;
      let hs=0,hc=0,ss=0,ls=0,n=0; const lums=[];
      for(let i=0;i<data.length;i+=4){
        const [h,s,l]=rgbToHsl(data[i],data[i+1],data[i+2]);
        hs+=Math.sin(h*Math.PI/180); hc+=Math.cos(h*Math.PI/180);
        ss+=s; ls+=l; n++;
        lums.push(0.2126*data[i]+0.7152*data[i+1]+0.0722*data[i+2]);
      }
      let avgH=Math.atan2(hs,hc)*180/Math.PI; if(avgH<0)avgH+=360;
      const avgS=ss/n, avgL=ls/n;
      let edge=0,ec=0;
      for(let y=0;y<size-1;y++){for(let x=0;x<size-1;x++){
        const i=y*size+x;
        edge+=Math.abs(lums[i]-lums[i+1])+Math.abs(lums[i]-lums[i+size]); ec+=2;
      }}
      const edginess=Math.min(1,(edge/ec)/60);
      resolve({h:avgH,s:avgS,l:avgL,e:edginess, dataUrl:e.target.result});
    }; img.src=e.target.result; };
    reader.readAsDataURL(file);
  });
}
function hueDist(h,range){
  const mid=(range[0]+range[1])/2;
  let d=Math.abs(h-mid); d=Math.min(d,360-d);
  const span=(range[1]-range[0])/2+18;
  return Math.min(1,d/span/2.2);
}
function rangeDist(v,range){
  if(v>=range[0]&&v<=range[1])return 0;
  const d=v<range[0]?range[0]-v:v-range[1];
  return Math.min(1,d/0.35);
}
function matchDisease(sample){
  const scored = DISEASES.map(d=>{
    const dh=hueDist(sample.h,d.sig.h), ds=rangeDist(sample.s,d.sig.s), dl=rangeDist(sample.l,d.sig.l), de=rangeDist(sample.e,d.sig.e);
    const dist = dh*0.4+ds*0.22+dl*0.22+de*0.16;
    return {d,dist};
  }).sort((a,b)=>a.dist-b.dist);
  const conf = arr=>Math.round(Math.max(38,Math.min(95,100-arr.dist*118)));
  return scored.map(x=>({disease:x.d,confidence:conf(x)}));
}

    : ['Eat 32%','Gift 40%','Sell 20%','Consign 60%'];
  return `
  <div class="view-head"><div><h2>${tr('harvestLogTitle')}</h2><p>${tr('harvestLogDesc')}</p></div>
    <button class="btn btn-accent facet-sm">${tr('logNewHarvest')}</button></div>
  <div class="tablewrap">
    <table>
      <thead><tr><th>${tr('colDate')}</th><th>${tr('colTreeId')}</th><th>${tr('colWeight')}</th><th>${tr('colGrade')}</th><th>${tr('colAllocation')}</th><th>${tr('colRecordedBy')}</th></tr></thead>
      <tbody>
        ${rows.map((t,i)=>`
        <tr>
          <td class="mono">${treeUpdated(t)}</td><td class="mono">${t.id}</td>
          <td class="mono">${t.weightKg||randInt(24,42)} kg</td>
          <td><span class="pill pill-accent">${L(GRADE_LABEL[t.grade||'exportA'])}</span></td>
          <td>${allocSamples[i%4]}</td>
          <td>${tr('farmOps')}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ---- Disease diagnosis view ---- */
function renderBDiagnosis(){
  return `
  <div class="view-head"><div><h2>${tr('diagTitle')}</h2><p>${tr('diagDesc')}</p></div></div>
  <div class="diag-tabs">
    <button class="${STATE.diagTab==='photo'?'active':''}" data-diagtab="photo">${tr('diagPhoto')}</button>
    <button class="${STATE.diagTab==='checklist'?'active':''}" data-diagtab="checklist">${tr('diagChecklist')}</button>
    <button class="${STATE.diagTab==='library'?'active':''}" data-diagtab="library">${tr('diagLibrary')}</button>
    <button class="${STATE.diagTab==='log'?'active':''}" data-diagtab="log">${tr('diagLog')} (${STATE.diagLogs.length})</button>
  </div>
  <div id="diagBody">${renderDiagTab()}</div>
  `;
}
function renderDiagTab(){
  if(STATE.diagTab==='photo') return renderDiagPhoto();
  if(STATE.diagTab==='checklist') return renderDiagChecklist();
  if(STATE.diagTab==='library') return renderDiagLibrary();
  if(STATE.diagTab==='log') return renderDiagLog();
  return '';
}
function renderDiagPhoto(){
  return `
  <div class="card facet-sm" style="margin-bottom:0">
    <label class="upload-zone facet-sm" id="uploadZone" style="cursor:pointer">
      ${icon('upload')}
      <p><b>${tr('uploadTitle')}</b><br>${tr('uploadSub')}</p>
      <input type="file" id="photoInput" accept="image/*" style="display:none">
    </label>
    <div id="analysisOut" class="mt16"></div>
  </div>`;
}
function renderDiagChecklist(){
  return `
  <div class="card facet-sm">
    <p class="small muted mb16">${tr('checklistDesc')}</p>
    <div class="symptom-list">
      ${SYMPTOM_BANK.map((s,i)=>`<button class="symptom-chip facet-sm ${STATE.selectedSymptoms.has(i)?'selected':''}" data-symptom="${i}">${L(s.label)}</button>`).join('')}
    </div>
    <button class="btn btn-accent facet-sm mt16" id="getDiagnosis">${tr('getDiagnosisBtn')}</button>
    <div id="checklistOut" class="mt16"></div>
  </div>`;
}
function renderDiagLibrary(){
  return `<div class="libgrid">
    ${DISEASES.filter(d=>d.id!=='healthy').map(d=>`
    <div class="lib-card facet-sm">
      <div class="flex items-center" style="justify-content:space-between"><h4>${L(d.name)}</h4><span class="pill badge-severity-${d.severity}">${tr('sev'+d.severity.charAt(0).toUpperCase()+d.severity.slice(1))}</span></div>
      <div class="sci">${L(d.sci)} · ${L(d.cat)}</div>
      <b class="small">${tr('likelySymptoms')}</b>
      <ul>${L(d.symptoms).map(s=>`<li>${s}</li>`).join('')}</ul>
      <b class="small">${tr('recommendedTreatment')}</b>
      <ul>${L(d.treatment).map(s=>`<li>${s}</li>`).join('')}</ul>
    </div>`).join('')}
  </div>`;
}
function renderDiagLog(){
  if(STATE.diagLogs.length===0) return `<div class="card facet-sm empty">${tr('emptyDiagLog')}</div>`;
  return `<div class="tablewrap"><table>
    <thead><tr><th>${tr('colDate')}</th><th>${tr('colTree')}</th><th>${tr('colDiagnosis')}</th><th>${tr('colMethod')}</th><th>${tr('colConfidence')}</th></tr></thead>
    <tbody>${STATE.diagLogs.slice().reverse().map(l=>`
      <tr><td class="mono small">${l.date}</td><td class="mono">${l.treeId}</td><td>${L(diseaseById(l.diseaseId).name)}</td><td>${tr(l.methodKey)}</td><td class="mono">${l.confidence?l.confidence+'%':'—'}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function diagnosisResultHtml(matches, methodKey, thumbHtml){
  const top = matches[0];
  return `
  <div class="preview-row">
    ${thumbHtml||''}
    <div class="result-card facet-sm">
      <div class="flex items-center" style="justify-content:space-between">
        <b>${L(top.disease.name)}</b>
        <span class="pill badge-severity-${top.disease.severity}">${tr('sev'+top.disease.severity.charAt(0).toUpperCase()+top.disease.severity.slice(1))}</span>
      </div>
      <div class="small muted" style="font-style:italic">${L(top.disease.sci)}</div>
      <div class="small muted mt8">${tr('matchConfidence')}</div>
      <div class="confidence-bar"><div class="confidence-fill" style="width:${top.confidence}%"></div></div>
      <div class="mono small" style="margin-top:4px">${top.confidence}%</div>
      <div class="mt16"><b class="small">${tr('likelySymptoms')}</b><ul style="margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--text-muted);line-height:1.6">${L(top.disease.symptoms).map(s=>`<li>${s}</li>`).join('')}</ul></div>
      <div class="mt16"><b class="small">${tr('recommendedTreatment')}</b><ol style="margin:6px 0 0;padding-left:16px;font-size:12px;color:var(--text-muted);line-height:1.6">${L(top.disease.treatment).map(s=>`<li>${s}</li>`).join('')}</ol></div>
      ${matches[1]&&matches[1].confidence>45?`<div class="small muted mt16">${tr('secondPossibility')} <b style="color:var(--text)">${L(matches[1].disease.name)}</b> (${matches[1].confidence}%)</div>`:''}
      <div class="mt16 flex gap8" style="align-items:center;flex-wrap:wrap">
        <select id="logTreeSelect" style="padding:8px 10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border);font-size:12.5px">
          ${ORCHARD.trees.map(t=>`<option value="${t.id}">${t.id}</option>`).join('')}
        </select>
        <button class="btn btn-ghost btn-sm facet-sm" id="logDiagBtn" data-diseaseid="${top.disease.id}" data-methodkey="${methodKey}">${tr('logToTreeBtn')}</button>
      </div>
    </div>
  </div>`;
}

/* ---- Fulfilment / Members ---- */
function renderBFulfillment(){
  const cols=[{k:'packaging',label:tr('colPackaging')},{k:'dispatched',label:tr('colDispatched')},{k:'delivered',label:tr('colDelivered')}];
  return `
  <div class="view-head"><div><h2>${tr('fulfilTitle')}</h2><p>${tr('fulfilDesc')}</p></div></div>
  <div class="kanban">
    ${cols.map(c=>{
      const items = STATE.fulfillment.filter(f=>STATE.fulfillmentStages[f.id]===c.k);
      return `<div class="kancol"><h4>${c.label}<span>${items.length}</span></h4>
        ${items.map(f=>{
          const mem = ORCHARD.members[f.memberIdx];
          return `<div class="kancard facet-sm"><b>${f.tree} · ${f.kg}kg</b><span>${householdName(mem.household)}</span><br><span class="pill pill-neutral mt8" style="margin-top:6px">${tr(f.type)}</span></div>`;
        }).join('')||`<p class="small muted">${tr('emptyCol')}</p>`}
      </div>`;
    }).join('')}
  </div>`;
}
function renderBMembers(){
  return `
  <div class="view-head"><div><h2>${tr('membersTitle')}</h2><p>${tr('membersDesc')}</p></div></div>
  <div class="tablewrap"><table>
    <thead><tr><th>${tr('colHousehold')}</th><th>${tr('colGroup')}</th><th>${tr('colPlanMonth')}</th><th>${tr('statusCol')}</th><th>${tr('colReferrals')}</th><th>${tr('colCredits')}</th></tr></thead>
    <tbody>${ORCHARD.members.map(m=>`
      <tr><td>${householdName(m.household)}</td><td class="mono">${m.group}</td><td class="mono">${m.joinMonth}/24</td>
      <td><span class="pill ${m.boxOpened?'pill-good':'pill-warn'}">${m.boxOpened?tr('statusActive'):tr('statusAwaiting')}</span></td>
      <td class="mono">${m.referrals}</td><td class="mono">RM ${m.credits}</td></tr>`).join('')}
    </tbody></table></div>`;
}

/* ================= EVENTS ================= */
function wireEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>setView(el.getAttribute('data-nav'))));
  document.querySelectorAll('[data-lang]').forEach(el=>el.addEventListener('click',()=>setLang(el.getAttribute('data-lang'))));
  document.querySelectorAll('[data-msub]').forEach(el=>el.addEventListener('click',()=>{STATE.memberSub=el.getAttribute('data-msub');render();}));
  document.querySelectorAll('[data-bsub]').forEach(el=>el.addEventListener('click',()=>{STATE.backSub=el.getAttribute('data-bsub');render();}));
  const msel=document.getElementById('memberSelect');
  if(msel) msel.addEventListener('change',e=>{STATE.currentMemberId=e.target.value; STATE.memberSub='dashboard'; render();});

  document.querySelectorAll('[data-box]').forEach(el=>el.addEventListener('click',()=>{
    if(el.classList.contains('revealed'))return;
    el.classList.add('revealed');
    const all=document.querySelectorAll('.boxcard');
    if([...all].every(c=>c.classList.contains('revealed'))){
      const btn=document.getElementById('finishReveal'); if(btn)btn.style.display='inline-flex';
    }
  }));
  const finishBtn=document.getElementById('finishReveal');
  if(finishBtn) finishBtn.addEventListener('click',()=>{
    const m=currentMember(); m.boxOpened=true; render();
  });

  document.querySelectorAll('[data-treeid]').forEach(el=>el.addEventListener('click',()=>{
    document.body.insertAdjacentHTML('beforeend',treeDetailModal(el.getAttribute('data-treeid')));
    document.getElementById('modalClose').addEventListener('click',closeModal);
    document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();});
  }));

  const allocInputs = document.querySelectorAll('[data-alloc]');
  if(allocInputs.length){
    const normalize=()=>{
      const vals={}; let total=0;
      allocInputs.forEach(i=>{vals[i.getAttribute('data-alloc')]=parseInt(i.value);total+=parseInt(i.value);});
      document.getElementById('allocTotal').textContent = total+'%';
      const totalKg = 24;
      allocInputs.forEach(i=>{
        const k=i.getAttribute('data-alloc');
        document.querySelector(`[data-allocval="${k}"]`).textContent = (totalKg*(vals[k]/ (total||1))).toFixed(1)+' kg';
      });
    };
    allocInputs.forEach(i=>i.addEventListener('input',normalize));
    normalize();
  }
  const giftBtn=document.getElementById('genGiftCard');
  if(giftBtn) giftBtn.addEventListener('click',()=>{
    const m=currentMember(); const t=treesInGroup(m.group).find(tt=>tt.stage==='Harvest-Ready'||tt.stage==='Harvested');
    document.getElementById('giftCardOut').innerHTML = `
    <div class="card facet-sm mt16" style="background:var(--primary-soft);box-shadow:none">
      <div class="mono small" style="color:var(--primary-strong)">${tr('giftCardLabel')}</div>
      <h3 style="margin-top:8px;font-size:17px">${trf('giftCardTitle',{id:t?t.id:''})}</h3>
      <p class="small mt8" style="color:var(--primary-strong)">${trf('giftCardDesc',{name:householdName(m.household),n:m.joinMonth})}</p>
    </div>`;
  });

  document.querySelectorAll('[data-diagtab]').forEach(el=>el.addEventListener('click',()=>{
    STATE.diagTab=el.getAttribute('data-diagtab'); render();
  }));
  const pinput=document.getElementById('photoInput');
  if(pinput) pinput.addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file)return;
    document.getElementById('analysisOut').innerHTML = `<p class="small muted">${tr('analysing')}</p>`;
    const sample = await analyzeImageFile(file);
    const matches = matchDisease(sample);
    document.getElementById('analysisOut').innerHTML = diagnosisResultHtml(matches,'methodPhoto',`<img class="preview-thumb facet-sm" src="${sample.dataUrl}">`);
    wireDiagLogButton();
  });
  document.querySelectorAll('[data-symptom]').forEach(el=>el.addEventListener('click',()=>{
    const idx=parseInt(el.getAttribute('data-symptom'));
    if(STATE.selectedSymptoms.has(idx)) STATE.selectedSymptoms.delete(idx); else STATE.selectedSymptoms.add(idx);
    el.classList.toggle('selected');
  }));
  const getDiagBtn=document.getElementById('getDiagnosis');
  if(getDiagBtn) getDiagBtn.addEventListener('click',()=>{
    if(STATE.selectedSymptoms.size===0){document.getElementById('checklistOut').innerHTML=`<p class="small muted">${tr('selectAtLeastOne')}</p>`;return;}
    const scores={};
    STATE.selectedSymptoms.forEach(i=>{
      const s=SYMPTOM_BANK[i];
      Object.entries(s.map).forEach(([id,w])=>{scores[id]=(scores[id]||0)+w;});
    });
    const maxScore=Math.max(...Object.values(scores));
    const matches = Object.entries(scores).map(([id,sc])=>({disease:diseaseById(id),confidence:Math.round(40+sc/maxScore*55)})).sort((a,b)=>b.confidence-a.confidence);
    document.getElementById('checklistOut').innerHTML = diagnosisResultHtml(matches,'methodChecklist','');
    wireDiagLogButton();
  });
}
function wireDiagLogButton(){
  const btn=document.getElementById('logDiagBtn');
  if(!btn)return;
  btn.addEventListener('click',()=>{
    const treeId=document.getElementById('logTreeSelect').value;
    const diseaseId=btn.getAttribute('data-diseaseid');
    const methodKey=btn.getAttribute('data-methodkey');
    STATE.diagLogs.push({treeId,diseaseId,methodKey,date:STATE.lang==='zh'?'2026年8月28日':'28 Aug 2026',confidence:null});
    const tr2=ORCHARD.trees.find(t=>t.id===treeId);
    if(tr2 && diseaseId!=='healthy'){tr2.health='Issue';tr2.issueId=diseaseId;}
    btn.textContent=tr('loggedBtn'); btn.disabled=true;
  });
}
function closeModal(){const b=document.getElementById('modalBackdrop'); if(b)b.remove();}

render();
</script>
